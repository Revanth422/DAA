name: Lecture_solver

on:
  workflow_dispatch:
  push:
    branches:
      - lecture_solver

permissions:
  contents: read

jobs:
  run-program:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run my program
        run: lecturesolver.py
