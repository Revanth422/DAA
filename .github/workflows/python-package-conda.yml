name: Lecture Solver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lecture-solver:
    name: Test lecture_solver.py (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: python -m py_compile lecture_solver.py

      - name: Run built-in demo tests
        run: python lecture_solver.py --demo

      - name: Compare solver against brute force
        run: python lecture_solver.py --stress 500

      - name: Run solver on sample input
        run: python lecture_solver.py sample.txt
