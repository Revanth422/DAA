
name: Run Lecture Solver

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-solver:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run demonstration tests
        run: python lecture_solver.py --demo

      - name: Run sample input
        run: python lecture_solver.py sample.txt

      - name: Run randomized stress test
        run: python lecture_solver.py --stress 100
